name: Envio de e-mail de teste

on:
  workflow_dispatch:
  schedule:
  # 07:34 UTC equivale a 05:34 de Brasília, necessário colocar esse horário por conta do delay do GitHub (Execução principal pela manhã)
    - cron: '34 07 * * 1-5'

jobs:
  enviar-email:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Executar envio de e-mail
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: python enviar_email.py
